<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦋 仿生蝴蝶控制器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #1a2f3f 0%, #0e1a26 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #e8f0fe;
        }
        
        .controller {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(100, 180, 255, 0.2) inset;
            border: 1px solid rgba(100, 180, 255, 0.3);
        }
        
        h1 {
            font-size: 28px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 160, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        h1 span {
            font-size: 32px;
        }
        
        .status-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            padding: 12px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .status-led {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            box-shadow: 0 0 8px #ff4444;
            transition: all 0.3s ease;
        }
        
        .led.connected {
            background: #4caf50;
            box-shadow: 0 0 12px #4caf50;
        }
        
        .device-name {
            font-size: 14px;
            opacity: 0.8;
        }
        
        /* 按钮通用样式 - 移动端优化 */
        .direction-btn, .trim-btn, .btn, .mode-option {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        
        .btn:hover {
            background: rgba(100, 180, 255, 0.3);
            border-color: #64b4ff;
        }
        
        .btn.primary {
            background: #2a6c9e;
            border-color: #64b4ff;
            box-shadow: 0 4px 12px rgba(0, 120, 255, 0.3);
        }
        
        /* 模式切换 */
        .mode-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .mode-option {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mode-option.active {
            background: #2a6c9e;
            box-shadow: 0 2px 8px rgba(0, 120, 255, 0.3);
        }
        
        /* WiFi输入区域 */
        .wifi-config {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .wifi-config.visible {
            display: block;
        }
        
        .ip-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 10px 16px;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .ip-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .ip-input:focus {
            outline: none;
            border-color: #64b4ff;
        }
        
        .wifi-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        
        .section {
            margin-bottom: 28px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #a0d0ff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .throttle-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .throttle-value {
            font-size: 42px;
            font-weight: 700;
            color: #ffd966;
            text-shadow: 0 0 20px rgba(255, 200, 50, 0.5);
            line-height: 1;
        }
        
        .throttle-slider {
            width: 100%;
            height: 40px;
            -webkit-appearance: none;
            background: transparent;
        }
        
        .throttle-slider::-webkit-slider-runnable-track {
            height: 12px;
            background: linear-gradient(90deg, #2a6c9e, #ffaa33, #ff5533);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .throttle-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 30px;
            width: 30px;
            border-radius: 50%;
            background: white;
            margin-top: -10px;
            box-shadow: 0 4px 12px black;
            border: 2px solid #64b4ff;
            cursor: pointer;
        }
        
        .direction-pad {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 16px 0;
        }
        
        .direction-btn {
            width: 70px;
            height: 70px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.3);
        }
        
        .direction-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        }
        
        .direction-btn.left {
            background: #2a4f6e;
        }
        
        .direction-btn.right {
            background: #2a4f6e;
        }
        
        .trim-controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .trim-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .trim-label {
            width: 70px;
            font-size: 15px;
        }
        
        .trim-buttons {
            display: flex;
            gap: 15px;
        }
        
        .trim-btn {
            width: 44px;
            height: 44px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .trim-btn:active {
            background: #2a6c9e;
        }
        
        .trim-value {
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            color: #ffd966;
            font-size: 18px;
        }
        
        .amplitude-area {
            margin-top: 16px;
        }
        
        .amplitude-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .amplitude-value {
            color: #64b4ff;
            font-weight: 600;
            font-size: 20px;
        }
        
        .amplitude-slider {
            width: 100%;
            height: 30px;
            -webkit-appearance: none;
            background: transparent;
        }
        
        .amplitude-slider::-webkit-slider-runnable-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        
        .amplitude-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #64b4ff;
            margin-top: -8px;
            border: 2px solid white;
            cursor: pointer;
        }
        
        .param-row {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 30px;
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="controller">
        <h1>
            <span>🦋</span> 仿生蝴蝶 <span>🦋</span>
        </h1>
        
        <!-- 模式切换 -->
        <div class="mode-switch">
            <div class="mode-option active" id="modeBluetooth">蓝牙</div>
            <div class="mode-option" id="modeWiFi">WiFi</div>
        </div>
        
        <!-- WiFi配置区域（默认隐藏） -->
        <div class="wifi-config" id="wifiConfig">
            <input type="text" class="ip-input" id="espIP" placeholder="输入ESP32 IP地址，例如: 192.168.1.100">
            <div class="wifi-hint">确保手机和ESP32在同一个WiFi网络</div>
        </div>
        
        <!-- 连接状态卡 -->
        <div class="status-card">
            <div class="status-led">
                <div class="led" id="ledIndicator"></div>
                <span id="statusText">未连接</span>
            </div>
            <div class="device-name" id="deviceInfo">---</div>
            <button class="btn primary" id="connectBtn">连接设备</button>
        </div>
        
        <!-- 油门控制区 -->
        <div class="section">
            <div class="section-title">
                <span>⚡</span> 油门 / 扇动频率
            </div>
            <div class="throttle-area">
                <div class="throttle-value" id="throttleDisplay">50</div>
                <input type="range" class="throttle-slider" id="throttleSlider" min="0" max="100" value="50">
            </div>
        </div>
        
        <!-- 方向控制区 -->
        <div class="section">
            <div class="section-title">
                <span>🧭</span> 方向控制
            </div>
            <div class="direction-pad">
                <div class="direction-btn left" id="turnLeft">←</div>
                <div class="direction-btn right" id="turnRight">→</div>
            </div>
            <div class="param-row">
                <span>当前转向</span>
                <span id="yawDisplay" style="color:#64b4ff;">居中</span>
            </div>
        </div>
        
        <!-- 微调控制区 -->
        <div class="section">
            <div class="section-title">
                <span>⚙️</span> 翅膀微调
            </div>
            <div class="trim-controls">
                <div class="trim-row">
                    <span class="trim-label">左翅膀</span>
                    <div class="trim-buttons">
                        <div class="trim-btn" id="leftTrimDown">−</div>
                        <span class="trim-value" id="leftTrimValue">0</span>
                        <div class="trim-btn" id="leftTrimUp">+</div>
                    </div>
                </div>
                <div class="trim-row">
                    <span class="trim-label">右翅膀</span>
                    <div class="trim-buttons">
                        <div class="trim-btn" id="rightTrimDown">−</div>
                        <span class="trim-value" id="rightTrimValue">0</span>
                        <div class="trim-btn" id="rightTrimUp">+</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 振翅幅度控制区 -->
        <div class="section">
            <div class="section-title">
                <span>📏</span> 振翅幅度
            </div>
            <div class="amplitude-area">
                <div class="amplitude-header">
                    <span>幅度</span>
                    <span class="amplitude-value" id="ampDisplay">70°</span>
                </div>
                <input type="range" class="amplitude-slider" id="ampSlider" min="30" max="150" value="70">
            </div>
        </div>
        
        <!-- 实时参数总览 -->
        <div class="param-row">
            <span>油门</span>
            <span id="paramThrottle">50</span>
            <span>幅度</span>
            <span id="paramAmp">70</span>
            <span>微调</span>
            <span id="paramTrim">L0/R0</span>
        </div>
        
        <div class="footer">
            ESP32 仿生蝴蝶专用控制器 | 蓝牙/WiFi双模
        </div>
    </div>
    
    <script>
        class ButterflyController {
            constructor() {
                // 控制参数
                this.throttle = 50;          // 油门 0-100
                this.yaw = 0;                 // 转向 -50~50
                this.leftTrim = 0;             // 左微调 -20~20
                this.rightTrim = 0;            // 右微调 -20~20
                this.amplitude = 70;           // 幅度 30-150
                
                // 连接模式: 'bluetooth' 或 'wifi'
                this.mode = 'bluetooth';
                
                // 蓝牙相关
                this.bluetoothDevice = null;
                this.bluetoothCharacteristic = null;
                
                // WiFi相关
                this.wifiIP = '';
                this.wifiFailCount = 0;         // 连续失败计数
                this.maxFailCount = 5;           // 最大允许失败次数
                
                // 通用状态
                this.isConnected = false;
                
                // 蓝牙服务UUID
                this.SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
                this.CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
                
                // 节流优化
                this.lastSentTime = 0;
                this.sendInterval = 50; // 限制 50ms 发送一次
                
                // 初始化UI
                this.initElements();
                this.initEventListeners();
                this.updateUI();
            }
            
            initElements() {
                // 模式切换
                this.modeBluetooth = document.getElementById('modeBluetooth');
                this.modeWiFi = document.getElementById('modeWiFi');
                this.wifiConfig = document.getElementById('wifiConfig');
                this.espIP = document.getElementById('espIP');
                
                // 状态元素
                this.ledIndicator = document.getElementById('ledIndicator');
                this.statusText = document.getElementById('statusText');
                this.deviceInfo = document.getElementById('deviceInfo');
                this.connectBtn = document.getElementById('connectBtn');
                
                // 油门
                this.throttleSlider = document.getElementById('throttleSlider');
                this.throttleDisplay = document.getElementById('throttleDisplay');
                
                // 方向
                this.turnLeft = document.getElementById('turnLeft');
                this.turnRight = document.getElementById('turnRight');
                this.yawDisplay = document.getElementById('yawDisplay');
                
                // 微调
                this.leftTrimUp = document.getElementById('leftTrimUp');
                this.leftTrimDown = document.getElementById('leftTrimDown');
                this.rightTrimUp = document.getElementById('rightTrimUp');
                this.rightTrimDown = document.getElementById('rightTrimDown');
                this.leftTrimValue = document.getElementById('leftTrimValue');
                this.rightTrimValue = document.getElementById('rightTrimValue');
                
                // 幅度
                this.ampSlider = document.getElementById('ampSlider');
                this.ampDisplay = document.getElementById('ampDisplay');
                
                // 参数总览
                this.paramThrottle = document.getElementById('paramThrottle');
                this.paramAmp = document.getElementById('paramAmp');
                this.paramTrim = document.getElementById('paramTrim');
            }
            
            initEventListeners() {
                // 模式切换
                this.modeBluetooth.addEventListener('click', () => {
                    this.modeBluetooth.classList.add('active');
                    this.modeWiFi.classList.remove('active');
                    this.wifiConfig.classList.remove('visible');
                    this.mode = 'bluetooth';
                    this.wifiFailCount = 0;
                    
                    if (this.isConnected) {
                        this.disconnectDevice();
                    }
                });
                
                this.modeWiFi.addEventListener('click', () => {
                    this.modeWiFi.classList.add('active');
                    this.modeBluetooth.classList.remove('active');
                    this.wifiConfig.classList.add('visible');
                    this.mode = 'wifi';
                    this.wifiFailCount = 0;
                    
                    if (this.isConnected) {
                        this.disconnectDevice();
                    }
                });
                
                // 连接按钮
                this.connectBtn.addEventListener('click', () => this.toggleConnection());
                
                // 油门滑块
                this.throttleSlider.addEventListener('input', (e) => {
                    this.throttle = parseInt(e.target.value);
                    this.updateUI();
                    this.sendCommand(`THR:${this.throttle}`);
                });
                
                // 方向按钮
                this.turnLeft.addEventListener('mousedown', () => {
                    this.yaw = -50;
                    this.updateUI();
                    this.sendCommand('YAW:LEFT');
                });
                
                this.turnLeft.addEventListener('mouseup', () => {
                    this.yaw = 0;
                    this.updateUI();
                    this.sendCommand('YAW:CENTER');
                });
                
                this.turnRight.addEventListener('mousedown', () => {
                    this.yaw = 50;
                    this.updateUI();
                    this.sendCommand('YAW:RIGHT');
                });
                
                this.turnRight.addEventListener('mouseup', () => {
                    this.yaw = 0;
                    this.updateUI();
                    this.sendCommand('YAW:CENTER');
                });
                
                // 触摸事件
                ['touchstart', 'touchend'].forEach(event => {
                    this.turnLeft.addEventListener(event, (e) => {
                        e.preventDefault();
                        if (event === 'touchstart') {
                            this.yaw = -50;
                            this.sendCommand('YAW:LEFT');
                        } else {
                            this.yaw = 0;
                            this.sendCommand('YAW:CENTER');
                        }
                        this.updateUI();
                    });
                    
                    this.turnRight.addEventListener(event, (e) => {
                        e.preventDefault();
                        if (event === 'touchstart') {
                            this.yaw = 50;
                            this.sendCommand('YAW:RIGHT');
                        } else {
                            this.yaw = 0;
                            this.sendCommand('YAW:CENTER');
                        }
                        this.updateUI();
                    });
                });
                
                // 微调按钮
                this.leftTrimUp.addEventListener('click', () => {
                    this.leftTrim = Math.min(20, this.leftTrim + 1);
                    this.updateUI();
                    this.sendCommand(`LTRIM:${this.leftTrim}`);
                });
                
                this.leftTrimDown.addEventListener('click', () => {
                    this.leftTrim = Math.max(-20, this.leftTrim - 1);
                    this.updateUI();
                    this.sendCommand(`LTRIM:${this.leftTrim}`);
                });
                
                this.rightTrimUp.addEventListener('click', () => {
                    this.rightTrim = Math.min(20, this.rightTrim + 1);
                    this.updateUI();
                    this.sendCommand(`RTRIM:${this.rightTrim}`);
                });
                
                this.rightTrimDown.addEventListener('click', () => {
                    this.rightTrim = Math.max(-20, this.rightTrim - 1);
                    this.updateUI();
                    this.sendCommand(`RTRIM:${this.rightTrim}`);
                });
                
                // 幅度滑块
                this.ampSlider.addEventListener('input', (e) => {
                    this.amplitude = parseInt(e.target.value);
                    this.updateUI();
                    this.sendCommand(`AMP:${this.amplitude}`);
                });
            }
            
            // 发送指令 - 节流优化
            sendCommand(command) {
                if (!this.isConnected) return;
                
                const now = Date.now();
                if (now - this.lastSentTime < this.sendInterval) {
                    if (command.startsWith('THR:') || command.startsWith('AMP:')) {
                        return; 
                    }
                }
                this.lastSentTime = now;
                
                if (this.mode === 'bluetooth') {
                    this.sendBluetoothCommand(command);
                } else {
                    this.sendWiFiCommand(command);
                }
            }
            
            // 蓝牙发送
            sendBluetoothCommand(command) {
                if (!this.bluetoothCharacteristic) return;
                
                const data = new TextEncoder().encode(command + '\n');
                this.bluetoothCharacteristic.writeValue(data)
                    .then(() => console.log('蓝牙发送:', command))
                    .catch(error => {
                        console.error('蓝牙发送失败:', error);
                        this.isConnected = false;
                        this.updateUI();
                    });
            }
            
            // WiFi发送 - 带超时控制和自动断开
            async sendWiFiCommand(command) {
                if (!this.wifiIP) return;
                
                const url = `http://${this.wifiIP}/control?cmd=${encodeURIComponent(command)}`;
                
                // 创建 AbortController 用于超时控制
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    controller.abort();
                    console.warn('WiFi请求超时:', command);
                }, 500); // 500ms 超时

                try {
                    // mode: 'no-cors' 是必要的，因为ESP32的HTTP服务器可能不支持CORS
                    await fetch(url, { 
                        mode: 'no-cors',
                        signal: controller.signal 
                    });
                    
                    // 发送成功时重置失败计数
                    this.wifiFailCount = 0;
                    
                } catch (error) {
                    if (error.name === 'AbortError') {
                        console.warn('WiFi请求超时，已取消:', command);
                    } else {
                        console.warn('WiFi发送失败:', command, error.message);
                    }
                    
                    // 连续失败计数
                    this.wifiFailCount++;
                    console.warn(`WiFi连续失败次数: ${this.wifiFailCount}/${this.maxFailCount}`);
                    
                    // 连续失败超过阈值，自动断开连接
                    if (this.wifiFailCount >= this.maxFailCount) {
                        console.warn('连续多次WiFi发送失败，断开连接');
                        this.isConnected = false;
                        this.deviceInfo.textContent = '连接断开';
                        this.updateUI();
                    }
                } finally {
                    clearTimeout(timeoutId);
                }
            }
            
            // 切换连接
            async toggleConnection() {
                if (this.isConnected) {
                    this.disconnectDevice();
                } else {
                    if (this.mode === 'bluetooth') {
                        await this.connectBluetooth();
                    } else {
                        await this.connectWiFi();
                    }
                }
            }
            
            // 连接蓝牙
            async connectBluetooth() {
                try {
                    if (!navigator.bluetooth) {
                        alert('当前环境不支持Web Bluetooth。请使用Chrome/Edge浏览器，或打包成App后使用。');
                        return;
                    }
                    
                    this.bluetoothDevice = await navigator.bluetooth.requestDevice({
                        filters: [
                            { namePrefix: 'Butterfly' },
                            { namePrefix: 'ESP32' },
                            { services: [this.SERVICE_UUID] }
                        ],
                        optionalServices: [this.SERVICE_UUID]
                    });
                    
                    this.deviceInfo.textContent = this.bluetoothDevice.name || '蓝牙设备';
                    
                    const server = await this.bluetoothDevice.gatt.connect();
                    const service = await server.getPrimaryService(this.SERVICE_UUID);
                    this.bluetoothCharacteristic = await service.getCharacteristic(this.CHARACTERISTIC_UUID);
                    
                    this.isConnected = true;
                    
                    this.bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                        this.isConnected = false;
                        this.updateUI();
                    });
                    
                    // 发送初始参数
                    setTimeout(() => {
                        this.sendCommand(`THR:${this.throttle}`);
                        this.sendCommand(`AMP:${this.amplitude}`);
                        this.sendCommand(`LTRIM:${this.leftTrim}`);
                        this.sendCommand(`RTRIM:${this.rightTrim}`);
                    }, 500);
                    
                } catch (error) {
                    console.error('蓝牙连接失败:', error);
                    alert('连接失败: ' + error.message);
                }
                
                this.updateUI();
            }
            
            // 连接WiFi
            async connectWiFi() {
                const ip = this.espIP.value.trim();
                
                const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
                if (!ipRegex.test(ip)) {
                    alert('请输入有效的IP地址，例如: 192.168.1.100');
                    return;
                }
                
                this.wifiIP = ip;
                this.deviceInfo.textContent = this.wifiIP;
                this.wifiFailCount = 0;
                
                try {
                    // 测试连接
                    const testUrl = `http://${this.wifiIP}/ping`;
                    
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 1000);
                    
                    await fetch(testUrl, { mode: 'no-cors', signal: controller.signal });
                    
                    clearTimeout(timeoutId);
                    this.isConnected = true;
                    
                    // 发送初始参数
                    this.sendCommand(`THR:${this.throttle}`);
                    this.sendCommand(`AMP:${this.amplitude}`);
                    this.sendCommand(`LTRIM:${this.leftTrim}`);
                    this.sendCommand(`RTRIM:${this.rightTrim}`);
                    
                } catch (error) {
                    console.error('WiFi连接测试失败:', error);
                    alert('无法连接到ESP32，请检查IP地址和网络连接');
                    this.isConnected = false;
                }
                
                this.updateUI();
            }
            
            // 断开连接
            disconnectDevice() {
                if (this.mode === 'bluetooth') {
                    if (this.bluetoothDevice && this.bluetoothDevice.gatt.connected) {
                        this.bluetoothDevice.gatt.disconnect();
                    }
                    this.bluetoothCharacteristic = null;
                } else {
                    this.wifiIP = '';
                    this.wifiFailCount = 0;
                }
                
                this.isConnected = false;
                this.updateUI();
            }
            
            // 更新UI
            updateUI() {
                if (this.isConnected) {
                    this.ledIndicator.classList.add('connected');
                    this.statusText.textContent = '已连接';
                    this.connectBtn.textContent = '断开连接';
                } else {
                    this.ledIndicator.classList.remove('connected');
                    this.statusText.textContent = '未连接';
                    this.connectBtn.textContent = '连接设备';
                    
                    if (this.mode === 'bluetooth') {
                        this.deviceInfo.textContent = '---';
                    } else {
                        this.deviceInfo.textContent = '---';
                    }
                }
                
                this.throttleDisplay.textContent = this.throttle;
                this.paramThrottle.textContent = this.throttle;
                
                if (this.yaw < 0) this.yawDisplay.textContent = '左转';
                else if (this.yaw > 0) this.yawDisplay.textContent = '右转';
                else this.yawDisplay.textContent = '居中';
                
                this.leftTrimValue.textContent = this.leftTrim;
                this.rightTrimValue.textContent = this.rightTrim;
                this.paramTrim.textContent = `L${this.leftTrim}/R${this.rightTrim}`;
                
                this.ampDisplay.textContent = this.amplitude + '°';
                this.paramAmp.textContent = this.amplitude;
                
                this.throttleSlider.value = this.throttle;
                this.ampSlider.value = this.amplitude;
            }
        }
        
        // 初始化控制器
        const controller = new ButterflyController();
    </script>
</body>
